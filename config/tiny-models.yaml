# Laptop / <= 1B model fleet.
#
# Every model is ≤ 1B parameters and quantized, so the whole system runs
# comfortably on a 6 GB laptop GPU or on CPU. Each role uses the best ≤1B model
# for its specific job. Quality is experiment-tier — trivial bug fixes,
# boilerplate, simple tests, repo Q&A — and ideal for iterating on the
# multi-model orchestration itself.
#
# Use it with:  python -m coding_agent --config config/tiny-models.yaml run "..."

defaults:
  base_url_template: "http://127.0.0.1:{port}/v1"
  timeout_s: 120
  max_tokens: 2048

roles:
  # Code-specialized Qwen, smallest in the family (Apache-2.0).
  coder:
    model: "Qwen2.5-Coder-0.5B-Instruct"
    port: 8002
    gguf: "qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"
    hf_repo: "Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF"
    temperature: 0.2
    max_tokens: 2048
    ctx: 8192

  # Strongest general reasoner in the ≤1B class. Non-thinking model.
  planner:
    model: "MiniCPM4-0.5B"
    port: 8001
    gguf: "MiniCPM4-0.5B-Q4_K_M.gguf"       # verify exact filename in the HF repo
    hf_repo: "openbmb/MiniCPM4-0.5B-GGUF"
    temperature: 0.6
    max_tokens: 2048
    ctx: 8192

  # Low-stakes: clean coder actions are mapped deterministically, so this model
  # only fires on messy intents or with --dispatch-all.
  dispatcher:
    model: "LFM2-350M"
    port: 8003
    gguf: "LFM2-350M-Q8_0.gguf"
    hf_repo: "LiquidAI/LFM2-350M-GGUF"
    temperature: 0.0
    max_tokens: 512
    ctx: 4096

  # Purpose-built text→JSON compressor.
  extractor:
    model: "LFM2-350M-Extract"
    port: 8004
    gguf: "LFM2-350M-Extract-Q8_0.gguf"
    hf_repo: "LiquidAI/LFM2-350M-Extract-GGUF"
    temperature: 0.0
    max_tokens: 512
    ctx: 8192

  # Best ≤1B for repo Q&A — 128K native context.
  rag:
    model: "Llama-3.2-1B-Instruct"
    port: 8005
    gguf: "Llama-3.2-1B-Instruct-Q4_K_M.gguf"
    hf_repo: "bartowski/Llama-3.2-1B-Instruct-GGUF"
    temperature: 0.3
    max_tokens: 1024
    ctx: 16384

  # Optional dense retriever. Omit entirely to fall back to the built-in TF-IDF.
  embedder:
    model: "LFM2-ColBERT-350M"
    port: 8006
    gguf: "LFM2-ColBERT-350M-Q8_0.gguf"
    hf_repo: "LiquidAI/LFM2-ColBERT-350M-GGUF"
    temperature: 0.0

sandbox:
  backend: "subprocess"
  docker_image: "python:3.12-slim"
  command_timeout_s: 120
  denylist:
    - "rm -rf /"
    - ":(){ :|:& };:"
    - "mkfs"
    - "dd if="
    - "shutdown"
    - "reboot"

loop:
  max_turns: 25
  require_passing_tests: true
  test_command: "python -m pytest -q"
  dispatch_all: false

retrieval:
  chunk_lines: 60
  chunk_overlap: 10
  top_k: 6
  index_dir: ".index"
  include_globs: ["**/*.py", "**/*.md", "**/*.txt", "**/*.toml", "**/*.yaml", "**/*.yml"]
  exclude_dirs: [".git", "__pycache__", "node_modules", ".venv", "venv", "models", ".index"]
