# Model lineup for the local multi-model coding agent.
#
# Each role points at an OpenAI-compatible endpoint (llama.cpp `llama-server`
# or Ollama). One llama-server per model, one port per model. The `model`
# field is the name the server reports on /v1/models — for llama-server this
# is usually the GGUF filename or whatever you pass to `--alias`.
#
# `mock: true` (or CLI --mock / env CODING_AGENT_MOCK=1) short-circuits every
# network call with a deterministic offline responder so the whole loop is
# runnable and testable without downloading a single weight.

defaults:
  base_url_template: "http://127.0.0.1:{port}/v1"
  timeout_s: 120
  max_tokens: 2048

roles:
  # The single 3B slot. Writes code, nothing else.
  coder:
    model: "Qwen2.5-Coder-3B-Instruct"
    port: 8002
    gguf: "Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf"
    hf_repo: "Qwen/Qwen2.5-Coder-3B-Instruct-GGUF"
    temperature: 0.2
    max_tokens: 2048
    ctx: 16384          # room for full-file rewrites + read context
    # Optional speculative-decoding draft model (same tokenizer family).
    draft_gguf: "Qwen2.5-Coder-0.5B-Instruct-Q8_0.gguf"
    draft_hf_repo: "Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF"

  # Top-level orchestrator. Thinking mode on. Never writes code.
  planner:
    model: "Qwen3.5-2B"
    port: 8001
    gguf: "Qwen3.5-2B-Q5_K_M.gguf"
    hf_repo: "Qwen/Qwen3.5-2B-GGUF"
    temperature: 0.6
    max_tokens: 2048
    thinking: true      # sent as chat_template_kwargs.enable_thinking
    ctx: 32768          # long-context planner is the whole point

  # Purpose-built concise function calling. Greedy, deterministic.
  dispatcher:
    model: "LFM2-1.2B-Tool"
    port: 8003
    gguf: "LFM2-1.2B-Tool-Q8_0.gguf"
    hf_repo: "LiquidAI/LFM2-1.2B-Tool-GGUF"
    temperature: 0.0
    max_tokens: 512
    ctx: 8192

  # Compresses raw tool output into structured JSON before it reaches planner.
  extractor:
    model: "LFM2-350M-Extract"
    port: 8004
    gguf: "LFM2-350M-Extract-Q8_0.gguf"
    hf_repo: "LiquidAI/LFM2-350M-Extract-GGUF"
    temperature: 0.0
    max_tokens: 512
    ctx: 8192

  # Optional: repo Q&A over retrieved chunks.
  # Swapped from LFM2-1.2B-RAG to MiniCPM5-1B (see REVIEW.md §4): same ~1.2 GB
  # Q8 footprint, but 131K native context (vs 32K), stronger code/reasoning
  # scores, Apache-2.0 (a licensing improvement), and a drop-in llama.cpp GGUF.
  # RAG answers are free prose, so MiniCPM's weaker strict-JSON formatting is
  # irrelevant here. The dispatcher/extractor/embedder stay LFM2 on purpose.
  rag:
    model: "MiniCPM5-1B"
    port: 8005
    gguf: "MiniCPM5-1B-Q8_0.gguf"          # verify exact filename in the HF repo
    hf_repo: "openbmb/MiniCPM5-1B-GGUF"
    temperature: 0.3
    max_tokens: 1024
    ctx: 32768          # MiniCPM5-1B is 131K-capable; cap for memory

  # Optional: retriever/embedder. Kept in the Liquid family.
  embedder:
    model: "LFM2-ColBERT-350M"
    port: 8006
    gguf: "LFM2-ColBERT-350M-Q8_0.gguf"
    hf_repo: "LiquidAI/LFM2-ColBERT-350M-GGUF"
    temperature: 0.0

sandbox:
  # "subprocess" runs commands locally under the repo working dir (fast, less
  # isolated; the denylist is best-effort only). "docker" runs them inside a
  # single long-lived --network none container per run — stronger isolation,
  # recommended for unfamiliar code. subprocess is the default so the offline
  # quick-start/tests work with no image build; switch to docker for real runs.
  backend: "subprocess"
  # For the docker backend, build the pytest-baked image first:
  #   ./scripts/build_sandbox_image.sh
  # then set: docker_image: "coding-agent-sandbox:latest"
  docker_image: "python:3.12-slim"
  command_timeout_s: 120
  # Commands matching these (substring) are refused outright.
  denylist:
    - "rm -rf /"
    - ":(){ :|:& };:"
    - "mkfs"
    - "dd if="
    - "shutdown"
    - "reboot"

loop:
  max_turns: 25
  # A run is only allowed to declare success after the EXACT test command has
  # been executed and passed; a mutating edit afterwards invalidates that.
  require_passing_tests: true
  test_command: "python -m pytest -q"
  # Route every tool call through the LFM2 dispatcher model (plan Phase-3
  # literal). Off by default: clean coder actions are mapped deterministically.
  dispatch_all: false

retrieval:
  chunk_lines: 60
  chunk_overlap: 10
  top_k: 6
  index_dir: ".index"
  # File globs to include when building the repo index.
  include_globs: ["**/*.py", "**/*.md", "**/*.txt", "**/*.toml", "**/*.yaml", "**/*.yml"]
  exclude_dirs: [".git", "__pycache__", "node_modules", ".venv", "venv", "models", ".index"]
