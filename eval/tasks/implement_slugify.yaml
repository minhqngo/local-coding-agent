name: implement_slugify
description: >
  Implement the `slugify` function in text_utils.py so it lowercases the input,
  strips leading/trailing whitespace, and replaces runs of non-alphanumeric
  characters with a single hyphen. Make the tests pass.

setup:
  files:
    text_utils.py: |
      def slugify(text):
          raise NotImplementedError
    test_text_utils.py: |
      from text_utils import slugify

      def test_basic():
          assert slugify("Hello World") == "hello-world"

      def test_symbols_and_spaces():
          assert slugify("  Foo__Bar!! baz  ") == "foo-bar-baz"

      def test_already_slug():
          assert slugify("already-a-slug") == "already-a-slug"

verify:
  test_command: "python -m pytest -q"

mock_actions:
  - action: write_file
    path: text_utils.py
    content: |
      import re


      def slugify(text):
          text = text.strip().lower()
          text = re.sub(r"[^a-z0-9]+", "-", text)
          return text.strip("-")
